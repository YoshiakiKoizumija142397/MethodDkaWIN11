<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="titleText">MethodDka</title>

    <style>
        body { font-family: Arial, sans-serif; }
        .container {
            max-width: 600px; margin: 0 auto; padding: 20px;
            background-color: #f9f9f9; border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .input-field { margin-bottom: 10px; }
        .input-field input {
            width: 100%; padding: 8px; box-sizing: border-box;
        }
        .button {
            padding: 10px 20px; background-color: #007bff;
            color: white; border: none; border-radius: 4px;
            cursor: pointer; margin-right: 8px; margin-top: 8px;
        }
        .button:hover { background-color: #0056b3; }
        .result {
            margin-top: 20px; padding: 10px;
            background-color: #e9ecef; border-radius: 4px;
        }
    </style>
</head>

<body>
<div class="container">
    <h1 id="title"></h1>

    <div class="input-field">
        <label for="maxDegree" id="labelMaxDegree"></label>
        <input type="number" id="maxDegree" />
    </div>

    <button class="button" id="btnSetMax" onclick="createFields()"></button>
    <div id="coefficients"></div>

    <button class="button" id="btnCalc" onclick="calculate()"></button>
    <div id="results"></div>
</div>

<script>
    let n;
    let sa = [];
    let sr = [];
    let si = [];
    let bSyuusoku = false;
    let i18n = {};

    // ▼ OS 言語を preload.js から取得
    const locale = window.localeAPI.getLocale();

    // ▼ JSON 読み込み
    fetch(`locales/${locale}.json`)
        .then(res => res.json())
        .then(json => {
            i18n = json;

            // UI テキスト反映
            document.getElementById("title").innerText = i18n.title;
            document.getElementById("titleText").innerText = i18n.title;
            document.getElementById("labelMaxDegree").innerText = i18n.maxDegree;
            document.getElementById("btnSetMax").innerText = i18n.setMaxDegree;
            document.getElementById("btnCalc").innerText = i18n.startCalc;
        });

    function createFields() {
        const maxDegree = document.getElementById('maxDegree').value.trim();
        n = Number(maxDegree);

        if (!Number.isInteger(n) || n < 1) {
            alert(i18n.alertInvalid);
            return;
        }

        const coefficientsDiv = document.getElementById('coefficients');
        coefficientsDiv.innerHTML = '';

        for (let i = 0; i <= n; i++) {
            const inputField = document.createElement('div');
            inputField.className = 'input-field';
            inputField.innerHTML =
                `<label>${n - i} : </label>
                 <input type="text" id="coefficient${i}" />`;
            coefficientsDiv.appendChild(inputField);
        }
    }

    function calculate() {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        sa = [];

        for (let i = 0; i <= n; i++) {
            const coefficient = document.getElementById(`coefficient${i}`).value;
            sa[i] = new Decimal(coefficient || "0");
        }

        if (sa[0].eq(0)) {
            alert(i18n.alertZero);
            return;
        }

        subroutine();

        if (!bSyuusoku) {
            alert(i18n.alertNoConv);
            return;
        }

        for (let i = 1; i <= n; i++) {
            const result = document.createElement('div');
            result.className = 'result';
            result.innerText =
                `${i18n.solution} ${i}:  Real ${sr[i].toString()}, Imag ${si[i].toString()}`;
            resultsDiv.appendChild(result);
        }
    }

    function subroutine() {
        let sx = Array.from({ length: n + 1 }, () => new Decimal(0));
        let sy = Array.from({ length: n + 1 }, () => new Decimal(0));

        let se = new Decimal("1e-50");
        let m = 100;
        let sp = Decimal.acos(-1);
        let sw = new Decimal(0);

        for (let i = 0; i <= n; i++) {
            sa[i] = sa[i].div(sa[0]);
        }

        for (let i = 2; i <= n; i++) {
            let sq = new Decimal(n).mul(sa[i].abs().pow(new Decimal(1).div(i)));
            if (sw.lt(sq)) sw = sq;
        }

        let sb = sp.mul(2).div(n);
        let sc = sp.div(2 * n);

        for (let j = 1; j <= n; j++) {
            let st = sb.mul(j - 1).add(sc);
            sr[j] = sw.mul(Decimal.cos(st));
            si[j] = sw.mul(Decimal.sin(st));
        }

        for (let k = 1; k <= m; k++) {
            let bContinue = false;

            for (let i = 1; i <= n; i++) {
                let s1 = new Decimal(1);
                let s2 = new Decimal(0);
                let s3 = new Decimal(1);
                let s4 = new Decimal(0);

                let sb2 = sr[i];
                let sc2 = si[i];

                for (let j = 1; j <= n; j++) {
                    let s5 = s1.mul(sb2).sub(s2.mul(sc2));
                    s2 = s1.mul(sc2).add(s2.mul(sb2));
                    s1 = s5.add(sa[j]);

                    if (j !== i) {
                        s5 = s3.mul(sb2.sub(sr[j])).sub(s4.mul(sc2.sub(si[j])));
                        s4 = s3.mul(sc2.sub(si[j])).add(s4.mul(sb2.sub(sr[j])));
                        s3 = s5;
                    }
                }

                sw = s3.pow(2).add(s4.pow(2));
                sx[i] = s1.mul(s3).add(s2.mul(s4)).div(sw);
                sy[i] = s2.mul(s3).sub(s1.mul(s4)).div(sw);

                sr[i] = sr[i].sub(sx[i]);
                si[i] = si[i].sub(sy[i]);

                if (sx[i].abs().gt(se) || sy[i].abs().gt(se)) {
                    bContinue = true;
                }
            }

            if (!bContinue) {
                bSyuusoku = true;
                alert(i18n.alertConv);
                return;
            }
        }

        bSyuusoku = false;
    }
</script>

</body>
</html>
